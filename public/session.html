<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Prep — Test Session</title>
  <meta name="description" content="Log answers, scores and notes for your IELTS practice session." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="/" class="logo-mark">
        <div>
          <div class="logo-text">IELTS Prep</div>
          <div class="logo-sub">Academic</div>
        </div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item" data-page="index"><span class="nav-icon"></span><span>Dashboard</span></a>
      <a href="/progress.html" class="nav-item" data-page="progress"><span class="nav-icon"></span><span>Progress</span></a>
      <a href="/settings.html" class="nav-item" data-page="settings"><span class="nav-icon"></span><span>Settings</span></a>
    </nav>
    <div class="sidebar-footer" style="display:flex;flex-direction:column;gap:4px;">
      <a href="https://forms.gle/sSuzFMHQmn37jxK16" target="_blank" class="nav-item" style="color: var(--accent); font-weight: 600; padding: 4px 10px;"><span class="nav-icon"></span><span>Feedback</span></a>
      <a href="/legal.html" class="nav-item" style="padding: 4px 10px;"><span class="nav-icon"></span><span>Privacy &amp; Terms</span></a>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb">
          <a href="/">Dashboard</a>
          <span class="sep">›</span>
          <a href="#" id="breadcrumb-book">Book</a>
          <span class="sep">›</span>
          <span class="current" id="breadcrumb-test">Test</span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="mode-badge" id="test-mode-badge">Practice</span>
        <button class="btn btn-ghost btn-sm" id="btn-edit-test">Edit Test Details</button>
        <a href="#" class="btn btn-secondary btn-sm" id="btn-back-book">Back to Book</a>
      </div>
    </header>

    <main class="page-content">
      <!-- Section Tabs -->
      <div class="tabs-bar">
        <button class="tab-btn active" data-section="Listening">Listening</button>
        <button class="tab-btn" data-section="Reading">Reading</button>
        <button class="tab-btn" data-section="Writing">Writing</button>
        <button class="tab-btn" data-section="Speaking">Speaking</button>
      </div>

      <!-- Active Section Info & Timer -->
      <div class="flex items-center justify-between mb-4 card" style="padding: 10px 14px; border-radius: var(--radius-md); background: var(--bg-surface); border: 1px solid var(--border);">
        <div class="flex items-center gap-3">
          <h2 class="page-title" id="timer-section-info" style="font-size: 15px; margin-bottom: 0;">Listening</h2>
          <span class="badge badge-blue" id="timer-limit" style="font-size: 11px;">Limit: 30 min</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="timer-digits" id="timer-display" style="font-size: 18px;">00:00</span>
          <div class="flex gap-2">
            <button class="btn btn-secondary btn-sm" id="btn-timer-start" style="padding: 4px 10px;">Start</button>
            <button class="btn btn-ghost btn-sm hidden" id="btn-timer-stop" style="padding: 4px 10px;">Pause</button>
            <button class="btn btn-ghost btn-sm" id="btn-timer-reset" style="padding: 4px 10px;">Reset</button>
          </div>
        </div>
      </div>

      <!-- ─── LISTENING PANEL ─── -->
      <div class="tab-panel active" id="panel-Listening">
        <div id="listening-parts"></div>
        <div class="section-save-bar">
          <div class="correct-tally" id="listening-tally">0 correct · 0 answered / 0 total</div>
          <button class="btn btn-primary" onclick="saveSection('Listening')">Save Listening</button>
        </div>
      </div>

      <!-- ─── READING PANEL ─── -->
      <div class="tab-panel" id="panel-Reading">
        <div id="reading-passages"></div>
        <div class="section-save-bar">
          <div class="correct-tally" id="reading-tally">0 correct · 0 answered / 0 total</div>
          <button class="btn btn-primary" onclick="saveSection('Reading')">Save Reading</button>
        </div>
      </div>

      <!-- ─── WRITING PANEL ─── -->
      <div class="tab-panel" id="panel-Writing">
        <div id="writing-tasks"></div>
        <div class="section-save-bar">
          <div></div>
          <button class="btn btn-primary" onclick="saveSection('Writing')">Save Writing</button>
        </div>
      </div>

      <!-- ─── SPEAKING PANEL ─── -->
      <div class="tab-panel" id="panel-Speaking">
        <div id="speaking-parts"></div>
        <div class="section-save-bar">
          <div></div>
          <button class="btn btn-primary" onclick="saveSection('Speaking')">Save Speaking</button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Edit Test Details Modal -->
<div class="modal-overlay" id="modal-edit-test">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Edit Test Details</h3>
      <button class="modal-close" onclick="Modal.close('modal-edit-test')">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="edit-test-num">Test Number</label>
        <input type="text" id="edit-test-num" />
      </div>
      <div class="form-group">
        <label for="edit-test-mode">Mode</label>
        <select id="edit-test-mode">
          <option value="practice">Practice</option>
          <option value="mock">Mock Test</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="edit-test-date">Date</label>
        <input type="date" id="edit-test-date" />
      </div>
      <div class="form-group">
        <label for="edit-test-score">Overall Band Score</label>
        <input type="number" id="edit-test-score" min="0" max="9" step="0.5" placeholder="e.g. 7.0" />
      </div>
    </div>
    <div class="form-group">
      <label for="edit-test-notes">Test Notes</label>
      <textarea id="edit-test-notes" placeholder="General observations or strategies..." rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="Modal.close('modal-edit-test')">Cancel</button>
      <button class="btn btn-primary" id="btn-update-test">Save Changes</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="/js/app.js"></script>
<script src="/js/session.js"></script>
</body>
</html>
